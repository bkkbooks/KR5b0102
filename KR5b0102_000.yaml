front:
  text: 固氣還神九轉瓊丹論位七
  hash: sha256:c58019941a5b8a34838416a784744e16500b4cd58b1b34b201d886b44ee2331d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0102_HFL_000-001a, image: hfl/0192/0192-106.png}
body:
  text: 固氣還神論夫天地之大德曰生生可保者身身之源天之沖氣隂陽媾精而所成以否泰返其類交為泰塞為否否久固無成育之理長久之祚人能則之乃可與天地齊體天地通氣精神之所樂凡生之源精之與氣一者常存何慮不生精氣之為物也如四時焉如日月焉運行則為常退守則為災四時不遞運萬物何以生日月不交映萬物何以明則知精氣非可效之此大惑矣經云流水不腐戶樞不蠧搖動為佳水木尚如斯而況於精氣乎所以精動則長其精如陽氣長泄而草木生榮由火因風而熾也天地離合隂陽升降自然之常道非物能遣男女施化得生之本孰有棄自然之生本而能常存人不則道之根本乃云固精為長生此言大為非也若閉精可以常存則布囊可以貯水且精化為血血化為氣氣化為精精氣變化未始有常縱不下施而有益也返使勞精遊於靈府邪氣通於命門為伐命之斧斤勞精為害靈之桎梏況世人徒好固精之名而不知養精之術所以固之雖存終隨氣而滅長精雖動則因血而生血盛顔榮腦枯髮變枯盛在中變形於外時人皆相覩不能明之且固精者先全其氣固氣者先還其精是以氣全則陽精不虧精還而元氣不散故黃庭經云三神還精老方壯以其精化氣而上騰氣不固乃精竭氣返液而下降精不還而氣傷如煎鼎水初無氣而為氣者何也以其下不能泄遇火所逼然也既而為氣氣騰為上上無所制則氣散氣散則涸水若下不使漏上不使散水為氣上氣復水而下上下循環終無有極是以黃庭經云通利道路無終休則固精養氣之妙也時人空知養氣之益不知養氣之術空知固精之名不知固精之道氣為精而下泄養何益也精為氣而上散固何益矣又黃庭經云能存元真萬事畢一身精神不可失故知道也在於變化得其道者在於還轉變故可還還轉至九天德著矣九轉瓊丹論夫靈丹之源稟乎真一之氣真一者為大道源水也水者氣也氣者道也道本無名因氣成質強名曰道以氣結形形質既分得名為丹華池旋運化氣自然是故太丹稟乎真一之氣用神水華池是也數起北方河車車數共輳滿三十輻法則月候應三十日每月六候陰陽各半互相受用內象二十四氣氣行一周丹行一次起北方坎位為一陽之首濳龍伸德之象定神水之受用神水華池但能受用真鉛若鉛不真神水無以能受若汞不真黑鉛無以能親仙家所忌雜類氣不用是故先定神水方合真鉛丹經曰鉛若不真其汞難住鉛若有真其汞自伏伏為流珠流珠化為金液又曰金漿又曰玉醴巳上俱是太丹變化之形符節使之然哉故言光定神水為之受用神水是大丹之窟宅其間採其鉛之精者便是黃芽收此芽重伸造化再理生成鍊至九轉得名丹砂得名紫遊砂得名仙光紫膏得名金液得名還丹斯乃並因神水之受用得名一之數變化自然也水數屬一舍氣滋真配位而黑得合真鉛真鉛金受北方黑氣水也且非世間之鉛與真鉛相類者汞且非世間之汞也此鉛藏光隱迹造化自然真鉛合五色之象應順五行感通造化故曰自然也或沉或浮能有能無金虎元君赤龍訣曰沉浮恍惚渺邈如雲其間有精有以經綸似有似無難辨素真且真者謂得一元氣為化為芽此芽與鉛異俗也謂巳結得真鉛之花透出鉛上修丹之士多不得此華錯認世間黑鉛結鉛黃花為芽誤之甚矣此華名神光流珠一名金華液一名黃輕一名神符白雪一名黃芽仙家最密此意蕭侍即大丹歌曰千年只為祕黃芽此芽在鼎若符節應候如聖如神數般元象並同天地造化之大功神運也實非容易獲茲芽者巳入神仙之鄉矣斯乃論大丹之要妙定神水之幽元且見今之鍊藥擬效長生殊不知靈丹之源妄求朱汞自古髙真不無仙經及丹書洞文衆仙內禁之訣莫不先明水火神水後理生成法象五行乾坤互用始自從無入有返歸於無還返數終神丹自備數還又返數返又還隨日月之虧盈順五行之情性且如十五十六月正圓明丹亦氣盛光明也月將虧月首又生生者謂生一氣也準前圓明而又攝伏九還七返此之謂也九為元陽之始七為太隂之初隂陽對用無窮故名曰道又仙經曰還返曰不差精凝不飛若以砂抽汞鉛霜取芽八石三黃五金雜類此俱不是大丹之源只可以法制添變為寶濟貪助道散接孤危若將此頑滯為丹又何得仙經云朝服一刀圭暮可生羽翼料兹頑質寧有此功痛哉甚矣又仙經云紫遊華蓋丹一銖度一人升天元陽君曰無質生質是還丹凡汞凡砂不勞弄且無質者神水華池也有質者神水氣結也大丹戚乎神水受氣而生因氣成質河上公曰惟恍惟惚共中有一經營立化因氣成質此之謂也仙家定水為宗化氣結子子母相戀名為大丹子受氣而成形丹稟水而立質兹明受氣而生斯乃仙家共禁之訣未嘗輕泄天機重難也水雖有形終而無質神仙以法制之升而復能生質也升則鼎中陽氣上騰降則壺中隂氣下結斯乃明論虛無之氣結而成丹虛無者橐籥中盛受二氣是也二氣者一隂一陽交媾為道故曰一隂一陽之謂道升降既以得度虛無靈質自生故曰無質生質是還丹隂真人曰造化成形便是無中之有隂靈託質方知有中曰無言逐月開鼎浴丹之時添合青龍沐浴白虎混然無質不見其形故曰有中之無也然則須憑漏刻反算五行綱斗璇璣進退合度其或遇進水進火之時俱在午前分漏焚香勿絶仰告上真乾火盛明恐鼎有失不可暫拋藥堂専聽龍吟盛位之聲審察隂陽調理之候或聞雄聲稍武暫開午門午門以上有巳門是絶乾之火雄武難當暫開午門是納隂之火以隂制陽之氣徐而清幽之韻氣和也微通火氣其聲清幽徐而速掩又恐歇氣多時節滯神丹變化其或遇進水退火之時時在姤卦一隂而仰五陽坤元亨利萬物質生承順乎天乃終有慶復霜堅水隂始凝也盛暑雷震恩以葳蕤芽體漸成修養無失漏應二更正自復吉大易曰配隂為陽主道之樞機伏藏為虎履霜光耀堅水寒沍此時丹化凝液也神水巳變大道功全造化既成黃芽有質鍊之九夑靈質可觀號曰老芽以兹方熟此芽鍊至九轉或如爛鍾乳疊石嵯峨科斗方勝文絲瑪瑙玉柱玲瓏别有靈異之象直候九轉變化將足收為大藥之基而後鍊還丹太一真人玉壷頌曰十月雪飛霜又濃黃芽內熟色顒顒修丹若見黃芽熟安得不思金虎龍思金虎龍者即是黃芽巳熟再思鍊大藥為丹龍虎者是金丹之號此芽雖熟為是孤陽之芽隂陽未足未堪為大藥重配青龍白虎方為大藥參同契云孤陽之芽未可獨立水合隂陽方為大藥此芽始自還丹之基本大藥之根元莫不重開造化再理生成合丹之水須澄直候月餘方用也合丹之水但澄之月餘慮其麈濁丹無光彩以金銀寶器盛之勿令麈入合丹之水水有輕重軟硬應漏即知輕重重可用謂道陽脈石泉也太上曰天得一以清地得一以寧萬物得一以生金丹運化理之自然得一者神水故曰神水華池神仙抱一之道沖融受氣而生且水性純陽形則純隂百斛入於釜中煎而乾之顯兹無質也一潤及於大地萬物生焉其有質也斯乃明顯盜氣而成質水也物尚盜氣而生金丹祕在神水故曰金丹之術百數妙在神水華池此訣天誡甚重而人莫知所以金丹得水芽兆兹隆興豈不從無形而立有神水也若以朱砂抽汞鉛花取芽氣類不同無由合道而况明分刻漏顯配五行晝夜璇璣應運符節符節者應十二時時下之數應漏直符節變大丹五色之光彩也全由符節使之然也無拋左右察聽吟聲時候稍差前功恐失真人有言曰且如金液之丹須是合津負液消化為漿故曰金液若以朱砂為汞水銀結霜又何金液之有哉斯乃學無稽古誤體經綸以意自栽遠道背德萬家傾産無一可成實謂世愚孰能開悟夫修丹切須認得真鉛然後經營造化若不知靈丹之宗徒費財寶廣成子曰若修上清神丹其或得根得源知水知火明藥物之銖兩應刻漏之元功如是則法天而行盡無不成矣故曰天地變化聖人效之天垂萬象聖人則之且如脈周一身漏行百刻時隨漏應以刻定時漏既不停丹隨時變丹變合度應刻順時時既不差巳合天道天時相應造化有歸名曰還丹豈不是法應乾坤運馳日月三才得備四象成真始自虛無從無制有且如定節分氣大凡五日一候運化變遷故曰後五日雀入水化為蛤後五日野雞入水化為蛋理丹元象造化亦同後五日神水冰丹形一斯乃天人共化律曆同遷且如今日直符發揚復卦行水火大數合乾坤二爻管十二時時數之內有隂有陽有明有暗有動有靜有進有退綱斗璇璣周行一匝隨卦變遷五色流光天人共愛此訣外鎸金簡內可存心非聞流俗之耳仙戒云天門開地戶裂聖人機勿妄泄又何輕論哉丹書云若得藥源萬一成矣成必利衆此藥得成有金家宅之功非獨一人升舉也且見今人鍊藥雖有其言而無其實朝朝説藥日日言丹究論真源罔知妙旨如斯焉能利衆而金家升舉者哉仙經云不得藥源一身難成若明神水全家歸真丹書云神水聖石一龍一虎二物之宗神仙為侣得者日學日新言得樂源經營有信一月一合開鼎沐浴觀丹顔色漸覩幽元轉資開悟其道日新權道守一權道紀綱妙在守一起甲之算春令發萌經云三一之道天地常以時消息巡歷后土歸于中宫中宫數五丹書云三五與一天地至精可以口訣難以書傳大丹之要非數莫之能成神水華池非真不能合其道守一始為道之紀綱皇天無親上天並養萬物愛人最深元象天機靡不出察道成德就感激玉皇惟善可親皇天是鑒我命在我非天致我有其生非天促我無其壽璣璣白日可養紅顔可學長生可以力致非丹不仙人身百餘斤何以輕舉若非金丹無由滌蕩神藥一化反老為童位列真人名標玉籍與天同壽與地齊休故曰非丹不仙鍊之可久運造神丹非一朝一夕之功凡九轉成芽芽九轉成丹並于造化須出名山福地晨昏資備同道數人藥室壇爐穿砌井竈晨昏朝謝勿起囂心志命歸真神明如一豈非容易歲久方成故錬之可久也餌之長新服藥之後三尸九蟲漸退還精補髓俱全暗室夜光童顔日盛精神爽異道氣光祥五嶽靈真自來朝會魂神徹視玉髓金身遊戲仙都長新極樂數通即化五行大數通運四時律吕既終靈丹自化數極乃神隂陽莫之能神隂極則陽濳陽極則隂伏二氣互用道之自然極者窮變也故曰窮變巳盡神因神以明道隂陽數極必然而成矣獲茲天機天下之能事莫過於道道之妙不過於丹理丹理之妙不迓卋軋化有形不迢於數數造金丹三五與一保兹天機神仙事畢永列真人世有傍通雜術何啻萬端若言永列真人一粒還丹升舉固氣還神九轉瓊丹論
